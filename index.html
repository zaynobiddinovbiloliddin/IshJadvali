<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <title>Ish jadvali</title>
    <style>
      #root:empty::before {
        content: "";
        display: block;
        width: 36px;
        height: 36px;
        margin: 40vh auto 0;
        border: 3px solid #e2e8f0;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: _spin .7s linear infinite;
      }
      @keyframes _spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // API prefetch — React mount bo'lishidan oldin boshlaydi
      (function () {
        try {
          var t = localStorage.getItem("authToken");
          if (t) {
            var h = { Authorization: "Bearer " + t, Accept: "application/json" };
            window.__pf = {
              dash: fetch("/api/dashboard", { headers: h }),
              dept: fetch("/api/departments", { headers: h })
            };
          }
        } catch (e) {}
      })();
      // Service Worker
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
